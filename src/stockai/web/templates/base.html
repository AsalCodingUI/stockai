<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}StockAI{% endblock %}</title>
    <!-- Google Fonts: Inter Display + Inter + JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Display:wght@400;500;600&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Design System Foundation (Miro DNA × Dark) -->
    <link rel="stylesheet" href="{{ url_for('static', path='css/design-system.css') }}">

    <!-- Tailwind CSS - CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        /* Miro brand palette adapted for dark */
                        "canvas":        "#010102",
                        "surface":       "#0F1011",
                        "surface-soft":  "#141516",
                        "hairline":      "#23252A",
                        "hairline-soft": "#1C1D21",
                        "hairline-strong":"#34343A",
                        /* Miro brand */
                        "miro-yellow":   "#FFD02F",
                        "miro-blue":     "#5E6AD2",
                        "miro-coral":    "#E8735A",
                        "miro-teal":     "#2CB5A0",
                        "miro-rose":     "#D4648A",
                        "miro-success":  "#27A644",
                        /* Text scale */
                        "ink":           "#F7F8F8",
                        "charcoal":      "#D0D6E0",
                        "slate":         "#A0A8B4",
                        "steel":         "#8A8F98",
                        "muted":         "#62666D",
                        /* Legacy aliases */
                        "bg-primary":    "#010102",
                        "bg-card":       "#0F1011",
                        "bg-card-hover": "#141516",
                        "border":        "#23252A",
                        "border-bright": "#34343A",
                        "green":         "#27A644",
                        "cyan":          "#5E6AD2",
                        "primary":       "#5E6AD2",
                        "secondary":     "#0F1011",
                        "text-primary":  "#F7F8F8",
                        "text-secondary":"#8A8F98",
                    },
                    fontFamily: {
                        sans:    ['"Inter"', '"Noto Sans"', 'sans-serif'],
                        display: ['"Inter Display"', '"Inter"', 'sans-serif'],
                        mono:    ['"JetBrains Mono"', '"Inter"', 'monospace'],
                    },
                    borderRadius: {
                        /* Miro radius scale */
                        'xs':      '4px',
                        'sm':      '6px',
                        'md':      '8px',
                        'lg':      '12px',
                        'xl':      '16px',
                        'xxl':     '20px',
                        'xxxl':    '28px',
                        'feature': '32px',
                        'full':    '9999px',
                    }
                }
            }
        };
    </script>

    <!-- Custom Utilities -->
    <link rel="stylesheet" href="{{ url_for('static', path='css/utilities.css') }}">

    <!-- Application Styles -->
    <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}">

    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Alpine.js for reactive components -->
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- Chart Libraries -->
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Base Styles -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--color-canvas);
            color: var(--color-ink);
            font-family: var(--font-family-base);
            min-height: 100vh;
        }
        /* Scrollbar — thin, hairline-colored */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--color-surface); }
        ::-webkit-scrollbar-thumb { background: var(--color-hairline-strong); border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--color-steel); }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body x-data="{ now: new Date().toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'}) }" class="app-body">
    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <!-- Brand / Wordmark — canary yellow (design.md: yellow only for wordmark) -->
            <a href="/" class="brand">
                <i class="ph ph-hexagon-fill text-xl"></i>
                STOCKAI
            </a>
            <nav class="side-nav">
                <a href="/" class="side-link flex items-center gap-2">
                    <i class="ph ph-squares-four text-sm"></i>
                    Dashboard
                </a>
                <a href="/coach" class="side-link flex items-center gap-2">
                    <i class="ph ph-target text-sm"></i>
                    AI Entry Coach
                </a>
                <a href="/journal" class="side-link flex items-center gap-2">
                    <i class="ph ph-chart-line text-sm"></i>
                    Signal Performance
                </a>
                <a href="/alerts" class="side-link flex items-center gap-2">
                    <i class="ph ph-bell text-sm"></i>
                    Alerts Feed
                </a>
            </nav>
        </aside>

        <!-- Main Panel -->
        <main class="main-panel">
            <!-- Topbar -->
            <header class="topbar">
                <div class="topbar-title">{{ title | default("StockAI Dashboard") }}</div>
                <!-- Search pill -->
                <div class="search-container" style="position:relative;display:flex;align-items:center;">
                    <input
                        id="global-search"
                        type="text"
                        placeholder="Cari saham..."
                        autocomplete="off"
                        style="
                            width: 280px;
                            padding: 8px 76px 8px 34px;
                            border-radius: var(--rounded-md);
                            border: 1px solid var(--color-hairline);
                            background: var(--color-surface);
                            color: var(--color-ink);
                            font-size: 13px;
                            height: 40px;
                            outline: none;
                            transition: border-color var(--duration-fast) var(--ease-out);
                        "
                        onfocus="this.style.borderColor='var(--color-hairline-strong)'"
                        onblur="this.style.borderColor='var(--color-hairline)'"
                    />
                    <i class="ph ph-magnifying-glass" style="
                        position:absolute;
                        left:11px;
                        color: var(--color-steel);
                        font-size:14px;
                        pointer-events:none;
                    "></i>
                    <span
                        id="search-shortcut-badge"
                        class="search-kbd"
                        style="
                            position:absolute;
                            right:8px;
                            background: var(--color-surface-soft);
                            border: 1px solid var(--color-hairline);
                            padding: 2px 6px;
                            border-radius: var(--rounded-xs);
                            font-size: 10px;
                            color: var(--color-steel);
                            font-family: var(--font-family-mono);
                        "
                    >⌘K</span>
                    <div
                        id="search-dropdown"
                        style="
                            display: none;
                            position: absolute;
                            top: 44px;
                            left: 0;
                            width: 100%;
                            background: var(--color-surface);
                            border: 1px solid var(--color-hairline-strong);
                            border-radius: var(--rounded-lg);
                            z-index: 1000;
                            max-height: 320px;
                            overflow-y: auto;
                            box-shadow: var(--shadow-xl);
                        "
                    ></div>
                </div>
                <!-- Status bar -->
                <div class="topbar-status">
                    <span id="next-scan-indicator" style="color:var(--color-steel)">⏱ Next scan: -</span>
                    <span class="live-dot"></span>
                    <span style="font-weight:500;color:var(--color-charcoal);font-size:11px;">LIVE</span>
                    <span x-text="now" style="font-family:var(--font-family-mono)"></span>
                </div>
            </header>

            <section class="content-shell">
                {% block content %}{% endblock %}
            </section>
        </main>
    </div>

    <script src="{{ url_for('static', path='js/app.js') }}?v=2"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
